<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Avinash Yadav - Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.6" stop-color="#120a2e"/>
      <stop offset="1" stop-color="#0a1830"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#4fd8ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F00FF"/>
      <stop offset="1" stop-color="#00C6FF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="420" rx="24"/></clipPath>

    <!-- isometric cube: color comes from currentColor -->
    <g id="cube">
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="currentColor"/>
      <polygon points="0,-60 52,-30 0,0 -52,-30" fill="#fff" opacity="0.38"/>
      <polygon points="0,0 52,-30 52,30 0,60" fill="#000" opacity="0.32"/>
      <polyline points="-52,-30 0,0 52,-30 M0,0 0,60" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.2"/>
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.2"/>
    </g>
    <text id="name" x="60" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="2">AVINASH YADAV</text>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#bg)"/>

    <!-- ambient glows -->
    <circle cx="930" cy="190" r="190" fill="#7F00FF" opacity="0.35" filter="url(#blur)"/>
    <circle cx="1080" cy="320" r="140" fill="#00C6FF" opacity="0.25" filter="url(#blur)"/>
    <circle cx="150" cy="60" r="130" fill="#FF4D9D" opacity="0.12" filter="url(#blur)"/>

    <!-- perspective floor grid -->
    <g stroke="#8f7bff" stroke-opacity="0.18" stroke-width="1">
      <line x1="0" y1="322" x2="1200" y2="322"/>
      <line x1="0" y1="338" x2="1200" y2="338"/>
      <line x1="0" y1="358" x2="1200" y2="358"/>
      <line x1="0" y1="382" x2="1200" y2="382"/>
      <line x1="0" y1="410" x2="1200" y2="410"/>
      <line x1="600" y1="300" x2="-300" y2="420"/>
      <line x1="600" y1="300" x2="0" y2="420"/>
      <line x1="600" y1="300" x2="300" y2="420"/>
      <line x1="600" y1="300" x2="600" y2="420"/>
      <line x1="600" y1="300" x2="900" y2="420"/>
      <line x1="600" y1="300" x2="1200" y2="420"/>
      <line x1="600" y1="300" x2="1500" y2="420"/>
    </g>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="520" cy="60" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="95" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="40" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="70" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="250" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating 3D cubes -->
    <g filter="url(#shadow)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="6s" repeatCount="indefinite"/>
        <use href="#cube" xlink:href="#cube" color="#7F00FF" transform="translate(900 170) scale(1.55)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="5s" repeatCount="indefinite"/>
        <use href="#cube" xlink:href="#cube" color="#00C6FF" transform="translate(1050 250) scale(1)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.2s" repeatCount="indefinite"/>
        <use href="#cube" xlink:href="#cube" color="#FF4D9D" transform="translate(770 275) scale(0.8)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="5.6s" repeatCount="indefinite"/>
        <use href="#cube" xlink:href="#cube" color="#FFB020" transform="translate(1110 105) scale(0.62)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.8s" repeatCount="indefinite"/>
        <use href="#cube" xlink:href="#cube" color="#22D3A6" transform="translate(955 330) scale(0.55)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="4.8s" repeatCount="indefinite"/>
        <use href="#cube" xlink:href="#cube" color="#4F7BFF" transform="translate(720 100) scale(0.5)"/>
      </g>
    </g>

    <!-- text block -->
    <g>
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
      <text x="62" y="112" font-family="'Fira Code','Consolas',monospace" font-size="16" letter-spacing="5" fill="#00C6FF" filter="url(#glow)">&lt;/&gt;  FULL STACK DEVELOPER</text>

      <!-- 3D extruded name -->
      <g>
        <use href="#name" xlink:href="#name" x="11" y="11" fill="#0a0420" opacity="0.8"/>
        <use href="#name" xlink:href="#name" x="9"  y="9"  fill="#1d0a4d"/>
        <use href="#name" xlink:href="#name" x="7"  y="7"  fill="#2e0f7a"/>
        <use href="#name" xlink:href="#name" x="5"  y="5"  fill="#4a15b8"/>
        <use href="#name" xlink:href="#name" x="3"  y="3"  fill="#6a1fe6"/>
        <use href="#name" xlink:href="#name" x="1.5" y="1.5" fill="#8b3dff"/>
        <use href="#name" xlink:href="#name" fill="url(#face)"/>
      </g>

      <text x="62" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" fill="#cbd5e1">Founder @ <tspan fill="#ffffff" font-weight="700">Hosting Aviator</tspan>  •  AI / ML Enthusiast</text>
      <rect x="62" y="268" width="150" height="4" rx="2" fill="url(#edge)"/>
    </g>

    <!-- tech chips -->
    <g font-family="'Fira Code','Consolas',monospace" font-size="14" text-anchor="middle" fill="#e2e8f0">
      <g><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.6s" fill="freeze"/>
        <rect x="62" y="296" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7F5CFF" stroke-opacity="0.7"/><text x="104" y="318">React</text></g>
      <g><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
        <rect x="158" y="296" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7F5CFF" stroke-opacity="0.7"/><text x="208" y="318">Next.js</text></g>
      <g><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.6s" fill="freeze"/>
        <rect x="270" y="296" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7F5CFF" stroke-opacity="0.7"/><text x="320" y="318">Node.js</text></g>
      <g><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.6s" fill="freeze"/>
        <rect x="382" y="296" width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7F5CFF" stroke-opacity="0.7"/><text x="428" y="318">Python</text></g>
      <g><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.6s" fill="freeze"/>
        <rect x="486" y="296" width="72" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7F5CFF" stroke-opacity="0.7"/><text x="522" y="318">Java</text></g>
    </g>

    <!-- frame -->
    <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
